<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vireo Bay — an open-world crime game</title>
<meta name="description" content="Vireo Bay: an open-world crime game in a sun-soaked bay city. Four jobs, one fast car, five wanted stars.">
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1210;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    position: relative;
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #2e7f9e;
    cursor: pointer;
  }
  #hint {
    position: absolute;
    left: 10px;
    bottom: 6px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Vireo Bay — a sun-soaked open-world crime game. WASD move &amp; drive, E enter a car, Space punch, F shoot, P pause.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
