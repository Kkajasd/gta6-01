<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vireo Bay — Make GTA 6</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1a0f1e;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #status {
        position: fixed;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status">Vireo Bay — WASD drive &amp; walk · E enter / steal · Space punch · F shoot · P pause</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
